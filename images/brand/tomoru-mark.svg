<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="TOMORU">
  <!-- TOMORU のマーク：2つのやわらかい灯りが寄りそって、1つの灯りになる（「ともに」＋「灯る」） -->
  <defs>
    <radialGradient id="tm-glow" cx="50%" cy="60%" r="50%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tm-a" cx="50%" cy="74%" r="70%">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset=".5" stop-color="#ffbe5c"/>
      <stop offset="1" stop-color="#ea7a30"/>
    </radialGradient>
    <radialGradient id="tm-b" cx="50%" cy="74%" r="70%">
      <stop offset="0" stop-color="#fffaea"/>
      <stop offset=".55" stop-color="#ffd88a"/>
      <stop offset="1" stop-color="#f3a347"/>
    </radialGradient>
  </defs>
  <!-- うしろのやわらかい光 -->
  <circle cx="60" cy="66" r="50" fill="url(#tm-glow)"/>
  <!-- 左の灯り：先が右（相手のほう）へ少し傾く -->
  <path d="M54 14 C 58 34 76 48 76 70 C 76 89 64 100 49 100 C 34 100 24 89 24 72 C 24 52 44 40 54 14 Z" fill="url(#tm-a)"/>
  <!-- 右の灯り：先が左へ少し傾き、左の灯りに寄りそう -->
  <path d="M74 38 C 72 54 96 62 96 80 C 96 94 86 102 74 102 C 62 102 54 94 54 82 C 54 66 70 58 74 38 Z" fill="url(#tm-b)" opacity=".93"/>
</svg>
