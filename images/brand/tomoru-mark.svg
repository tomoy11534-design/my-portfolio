<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 6 92 102" role="img" aria-label="TOMORU">
  <!-- TOMORU のマーク：2つのやわらかい灯りが寄りそって、1つの灯りになる（「ともに」＋「灯る」）
       明るい背景でもはっきり見えるよう、色を濃いめにし、光を大きくしている -->
  <defs>
    <radialGradient id="tm-glow" cx="50%" cy="58%" r="50%">
      <stop offset="0" stop-color="#ffb347" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#ffc56b" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tm-a" cx="50%" cy="76%" r="72%">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset=".35" stop-color="#ffab3d"/>
      <stop offset="1" stop-color="#dd5a17"/>
    </radialGradient>
    <radialGradient id="tm-b" cx="50%" cy="76%" r="72%">
      <stop offset="0" stop-color="#fff0bf"/>
      <stop offset=".4" stop-color="#ffc24f"/>
      <stop offset="1" stop-color="#ee8a1f"/>
    </radialGradient>
  </defs>
  <!-- うしろの光 -->
  <circle cx="60" cy="64" r="43" fill="url(#tm-glow)"/>
  <!-- 左の灯り：先が右（相手のほう）へ少し傾く -->
  <path d="M54 12 C 58 33 78 48 78 71 C 78 90 65 102 49 102 C 33 102 22 90 22 72 C 22 51 43 39 54 12 Z" fill="url(#tm-a)"/>
  <!-- 右の灯り：先が左へ少し傾き、左の灯りに寄りそう -->
  <path d="M75 36 C 73 53 98 62 98 81 C 98 95 87 104 74 104 C 61 104 52 95 52 82 C 52 65 70 57 75 36 Z" fill="url(#tm-b)"/>
  <!-- 2つの灯りの重なりに、細い線を入れて形を分かりやすくする -->
  <path d="M75 36 C 73 53 98 62 98 81 C 98 95 87 104 74 104 C 61 104 52 95 52 82 C 52 65 70 57 75 36 Z" fill="none" stroke="#fff6e6" stroke-width="2.2" stroke-opacity=".9"/>
</svg>
