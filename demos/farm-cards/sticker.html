<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>農園ステッカー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sticker.css">
</head>
<body>

  <!-- 画面だけに出る案内（印刷時は非表示） -->
  <div class="guide">
    <strong>ステッカー（46mm角・A4に24枚）</strong><br>
    <strong>印刷方法：</strong>A4のノーカットのシール用紙・<strong>倍率100%（実際のサイズ）</strong>・余白なし・片面印刷。点線でまっすぐ切ります。<br>
    上の3段＝Instagram版（野菜の袋など）、下の3段＝贈答用メロン予約版（メロン売り場など）。水に濡れる場所では耐水タイプの用紙がおすすめです。
  </div>

  <!-- A4用紙：上3段がInstagram版、下3段がメロン予約版 -->
  <section class="sheet" id="sheet"></section>

  <!-- Instagram版 -->
  <template id="tpl-insta">
    <article class="sticker">
      <p class="slogan">＼ 食べる喜びを育む ／</p>
      <p class="name"><span class="en">MIDORI FARM</span>みどりメロン農園</p>
      <img class="qr" src="qr-sample.svg" alt="InstagramのQRコード">
      <p class="caption">Instagram<small>@midori_melon_farm</small></p>
    </article>
  </template>

  <!-- 贈答用メロン予約版 -->
  <template id="tpl-reserve">
    <article class="sticker">
      <p class="slogan">＼ 食べる喜びを育む ／</p>
      <p class="name"><span class="en">MIDORI FARM</span>みどりメロン農園</p>
      <img class="qr" src="qr-sample.svg" alt="贈答用メロン予約ページのQRコード">
      <p class="caption">贈答用メロン<small>ご予約はこちら</small></p>
    </article>
  </template>

  <script>
    // 上3段（12枚）をInstagram版、下3段（12枚）をメロン予約版にする
    const sheet = document.getElementById('sheet');
    for (let i = 0; i < 24; i++) {
      const id = i < 12 ? 'tpl-insta' : 'tpl-reserve';
      sheet.appendChild(document.getElementById(id).content.cloneNode(true));
    }

    // 裁断ガイド：ステッカーの境目に用紙の端まで点線を引く（46mm間隔・中央配置）
    // ※ top / left はブラウザの予約名とぶつかるため、別の名前にしている
    const size = 46, cols = 4, rows = 6;
    const offsetX = (210 - size * cols) / 2;
    const offsetY = (297 - size * rows) / 2;
    for (let c = 0; c <= cols; c++) {
      const v = document.createElement('span');
      v.className = 'cut v';
      v.style.left = (offsetX + size * c) + 'mm';
      sheet.appendChild(v);
    }
    for (let r = 0; r <= rows; r++) {
      const h = document.createElement('span');
      h.className = 'cut h';
      h.style.top = (offsetY + size * r) + 'mm';
      sheet.appendChild(h);
    }
  </script>
</body>
</html>
